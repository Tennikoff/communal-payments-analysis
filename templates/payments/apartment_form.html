{% extends 'base.html' %}

{% block title %}{{ title }} - КоммуналПро{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow animate-fade-in-up">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">
                        <i class="bi bi-building me-2" style="color: var(--primary-color);"></i>{{ title }}
                    </h2>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                            <div class="text-danger small">
                                {% for error in field.errors %}{{ error }}{% endfor %}
                            </div>
                            {% endif %}
                        </div>
                        {% endfor %}
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-2"></i>Сохранить
                            </button>
                            <a href="{% url 'apartment_list' %}" class="btn btn-secondary">
                                <i class="bi bi-x-circle me-2"></i>Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
